  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

: 26px; margin-top: 14px;\">\n          <sc-for list=\"{{ heroStats }}\" as=\"st\" hint-placeholder-count=\"3\">\n            <div style=\"display: flex; flex-direction: column; gap: 3px;\">\n              <div style=\"font: 800 24px/1 'Archivo', sans-serif; color: #FFC531;\">{{ st.v }}<\u002Fdiv>\n              <div style=\"font: 400 13px/1.3 'Work Sans'; color: #A8B0BF;\">{{ st.l }}<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"min-width: 0; display: flex; justify-content: center;\">\n        <div style=\"width: 100%; max-width: 420px; aspect-ratio: 4/5; border-radius: 20px; background: linear-gradient(165deg, #1B2540 0%, #0C1322 100%); border: 1px solid rgba(255,197,49,0.28); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 26px; padding: 36px; box-sizing: border-box;\">\n          <svg sc-camel-view-box=\"0 0 120 120\" style=\"width: 58%; height: auto;\" role=\"img\" aria-label=\"Bright Wheels mark\">\n            <circle cx=\"60\" cy=\"60\" r=\"58\" fill=\"none\" stroke=\"rgba(255,197,49,0.3)\" stroke-width=\"2\"><\u002Fcircle>\n            <circle cx=\"60\" cy=\"60\" r=\"44\" fill=\"none\" stroke=\"#FFC531\" stroke-width=\"9\"><\u002Fcircle>\n            <g stroke=\"#FFC531\" stroke-width=\"9\" stroke-linecap=\"round\">\n              <line x1=\"60\" y1=\"26\" x2=\"60\" y2=\"94\"><\u002Fline>\n              <line x1=\"30\" y1=\"43\" x2=\"90\" y2=\"77\"><\u002Fline>\n              <line x1=\"30\" y1=\"77\" x2=\"90\" y2=\"43\"><\u002Fline>\n            <\u002Fg>\n            <circle cx=\"60\" cy=\"60\" r=\"13\" fill=\"#FFC531\"><\u002Fcircle>\n            <circle cx=\"60\" cy=\"60\" r=\"5\" fill=\"#10182B\"><\u002Fcircle>\n          <\u002Fsvg>\n          <div style=\"display: flex; flex-direction: column; align-items: center; gap: 8px; text-align: center;\">\n            <div style=\"font: 900 44px/1 'Archivo', sans-serif; color: #FFFFFF; letter-spacing: -0.02em;\">$69<\u002Fdiv>\n            <div style=\"font: 500 15px/1.4 'Work Sans'; color: #A8B0BF;\">All four wheels · 60 minutes<br>Rinseless, at your place<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section style=\"background: #FFC531; padding: 18px 28px;\">\n    <div style=\"max-width: 1100px; margin: 0 auto; display: flex; flex-wrap: wrap; gap: 14px 40px; justify-content: center; align-items: center;\">\n      <sc-for list=\"{{ ticker }}\" as=\"t\" hint-placeholder-count=\"4\">\n        <div style=\"font: 600 14px/1 'Work Sans'; color: #10182B; letter-spacing: 0.06em; text-transform: uppercase;\">{{ t }}<\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section id=\"services\" style=\"padding: 88px 28px; background: #FFFFFF;\">\n    <div style=\"max-width: 1100px; margin: 0 auto; display: flex; flex-direction: column; gap: 40px;\">\n      <div style=\"display: flex; flex-direction: column; gap: 12px; max-width: 620px;\">\n        <div style=\"font: 600 12px/1 'Work Sans'; letter-spacing: 0.22em; text-transform: uppercase; color: #1E6FB8;\">What we do<\u002Fdiv>\n        <h2 style=\"font: 800 clamp(30px, 4.4vw, 42px)/1.1 'Archivo', sans-serif; letter-spacing: -0.02em; margin: 0;\">Wheels first. Everything else second.<\u002Fh2>\n        <p style=\"font: 400 17px/1.6 'Work Sans'; color: #5A6377; margin: 0; text-wrap: pretty;\">No upsell menu twelve items deep. We start where most detailers rush, and we can take the rest of the car from there.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 20px;\">\n        <sc-for list=\"{{ services }}\" as=\"s\" hint-placeholder-count=\"4\">\n          <div style=\"background: #F6F7F9; border: 1px solid #E4E7EC; border-radius: 18px; padding: 28px; display: flex; flex-direction: column; gap: 12px; transition: transform 160ms ease, box-shadow 160ms ease;\" style-hover=\"transform: translateY(-4px); box-shadow: 0 14px 30px rgba(16,24,43,0.1);\">\n            <div style=\"width: 46px; height: 46px; border-radius: 12px; background: #10182B; color: #FFC531; display: flex; align-items: center; justify-content: center; font: 800 18px/1 'Archivo', sans-serif;\">{{ s.n }}<\u002Fdiv>\n            <div style=\"font: 700 20px/1.2 'Archivo', sans-serif;\">{{ s.title }}<\u002Fdiv>\n            <div style=\"font: 400 15px/1.55 'Work Sans'; color: #5A6377; text-wrap: pretty;\">{{ s.body }}<\u002Fdiv>\n            <div style=\"font: 600 14px/1 'Work Sans'; color: #1E6FB8; margin-top: 4px;\">{{ s.time }}<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section id=\"how\" style=\"padding: 80px 28px; background: #10182B; color: #FFFFFF;\">\n    <div style=\"max-width: 1100px; margin: 0 auto; display: flex; flex-direction: column; gap: 40px;\">\n      <h2 style=\"font: 800 clamp(30px, 4.4vw, 42px)/1.1 'Archivo', sans-serif; letter-spacing: -0.02em; margin: 0;\">Three steps. That's it.<\u002Fh2>\n      <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 28px;\">\n        <sc-for list=\"{{ steps }}\" as=\"st\" hint-placeholder-count=\"3\">\n          <div style=\"display: flex; flex-direction: column; gap: 12px; padding-top: 22px; border-top: 3px solid #FFC531;\">\n            <div style=\"font: 800 13px/1 'Work Sans'; letter-spacing: 0.2em; color: #FFC531;\">{{ st.k }}<\u002Fdiv>\n            <div style=\"font: 700 22px/1.2 'Archivo', sans-serif;\">{{ st.title }}<\u002Fdiv>\n            <div style=\"font: 400 15px/1.6 'Work Sans'; color: #B6BDCA; text-wrap: pretty;\">{{ st.body }}<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section id=\"pricing\" style=\"padding: 88px 28px; background: #F6F7F9;\">\n    <div style=\"max-width: 1100px; margin: 0 auto; display: flex; flex-direction: column; gap: 40px;\">\n      <div style=\"display: flex; flex-direction: column; gap: 12px; max-width: 620px;\">\n        <div style=\"font: 600 12px/1 'Work Sans'; letter-spacing: 0.22em; text-transform: uppercase; color: #1E6FB8;\">Pricing<\u002Fdiv>\n        <h2 style=\"font: 800 clamp(30px, 4.4vw, 42px)/1.1 'Archivo', sans-serif; letter-spacing: -0.02em; margin: 0;\">Flat rates, posted up front.<\u002Fh2>\n        <p style=\"font: 400 17px/1.6 'Work Sans'; color: #5A6377; margin: 0;\">Sedan pricing shown. SUVs and trucks add $20. Pet hair removal is +$45 on the Full Reset. Heavy curb rash and refinishing we'll refer out — we'd rather tell you than guess.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(270px, 1fr)); gap: 20px; align-items: start;\">\n        <sc-for list=\"{{ tiers }}\" as=\"t\" hint-placeholder-count=\"3\">\n          <div style=\"background: {{ t.bg }}; color: {{ t.fg }}; border: 1px solid {{ t.border }}; border-radius: 20px; padding: 32px 28px 28px; display: flex; flex-direction: column; gap: 18px;\">\n            <div style=\"display: flex; align-items: center; justify-content: space-between; gap: 12px;\">\n              <div style=\"font: 700 20px/1.2 'Archivo', sans-serif;\">{{ t.name }}<\u002Fdiv>\n              <div style=\"font: 600 11px/1 'Work Sans'; letter-spacing: 0.14em; text-transform: uppercase; background: {{ t.tagBg }}; color: {{ t.tagFg }}; padding: 7px 10px; border-radius: 999px;\">{{ t.tag }}<\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"display: flex; align-items: baseline; gap: 8px;\">\n              <div style=\"font: 900 46px/1 'Archivo', sans-serif; letter-spacing: -0.03em;\">{{ t.price }}<\u002Fdiv>\n              <div style=\"font: 400 15px/1 'Work Sans'; opacity: 0.72;\">{{ t.dur }}<\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"height: 1px; background: {{ t.rule }};\"><\u002Fdiv>\n            <div style=\"display: flex; flex-direction: column; gap: 10px;\">\n              <sc-for list=\"{{ t.items }}\" as=\"it\" hint-placeholder-count=\"5\">\n                <div style=\"display: flex; gap: 10px; align-items: flex-start;\">\n                  <div style=\"width: 7px; height: 7px; border-radius: 50%; background: {{ t.dot }}; margin-top: 7px; flex: none;\"><\u002Fdiv>\n                  <div style=\"font: 400 15px/1.45 'Work Sans';\">{{ it }}<\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n            <a href=\"#book\" style=\"margin-top: 6px; font: 700 15px/1 'Work Sans'; background: {{ t.btnBg }}; color: {{ t.btnFg }}; padding: 16px; border-radius: 999px; text-align: center; min-height: 44px; display: flex; align-items: center; justify-content: center;\" style-hover=\"opacity: 0.88;\">Book {{ t.name }}<\u002Fa>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section style=\"padding: 80px 28px; background: #FFFFFF;\">\n    <div style=\"max-width: 1100px; margin: 0 auto; display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 44px; align-items: center;\">\n      <div style=\"display: flex; flex-direction: column; gap: 18px; min-width: 0;\">\n        <div style=\"font: 600 12px/1 'Work Sans'; letter-spacing: 0.22em; text-transform: uppercase; color: #1E6FB8;\">Who we are<\u002Fdiv>\n        <h2 style=\"font: 800 clamp(28px, 4vw, 38px)/1.12 'Archivo', sans-serif; letter-spacing: -0.02em; margin: 0;\">Tilek &amp; Ramazan<\u002Fh2>\n        <p style=\"font: 400 17px/1.65 'Work Sans'; color: #5A6377; margin: 0; text-wrap: pretty;\">We started Bright Wheels this year, on our own cars, in our own parking lot. Wheels were the part nobody else bothered with — so that's the part we got good at first.<\u002Fp>\n        <p style=\"font: 400 17px/1.65 'Work Sans'; color: #5A6377; margin: 0; text-wrap: pretty;\">Right now that means the two of us and a Camry with the back seats down. No van, no crew, no franchise. Just the same two people every time, and prices that reflect the fact that we're new.<\u002Fp>\n        <div style=\"display: flex; flex-wrap: wrap; gap: 24px; margin-top: 6px;\">\n          <div style=\"display: flex; flex-direction: column; gap: 2px;\">\n            <div style=\"font: 600 16px/1.3 'Work Sans';\">Tilek Karaev<\u002Fdiv>\n            <a href=\"tel:4846899625\" style=\"font: 400 15px/1.3 'Work Sans';\">(484) 689-9625<\u002Fa>\n          <\u002Fdiv>\n          <div style=\"display: flex; flex-direction: column; gap: 2px;\">\n            <div style=\"font: 600 16px/1.3 'Work Sans';\">Ramazan Iusupov<\u002Fdiv>\n            <a href=\"tel:2132121902\" style=\"font: 400 15px/1.3 'Work Sans';\">(213) 212-1902<\u002Fa>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"min-width: 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 16px;\">\n        <sc-for list=\"{{ founders }}\" as=\"f\" hint-placeholder-count=\"2\">\n          <div style=\"background: #10182B; border-radius: 18px; padding: 28px 24px; display: flex; flex-direction: column; gap: 16px; aspect-ratio: 4/5; justify-content: space-between;\">\n            <div style=\"width: 68px; height: 68px; border-radius: 50%; background: #FFC531; color: #10182B; display: flex; align-items: center; justify-content: center; font: 900 24px/1 'Archivo', sans-serif;\">{{ f.initials }}<\u002Fdiv>\n            <div style=\"display: flex; flex-direction: column; gap: 6px;\">\n              <div style=\"font: 700 21px/1.2 'Archivo', sans-serif; color: #FFFFFF;\">{{ f.first }}<br>{{ f.last }}<\u002Fdiv>\n              <div style=\"font: 500 13px/1 'Work Sans'; letter-spacing: 0.14em; text-transform: uppercase; color: #FFC531;\">Co-founder<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section id=\"book\" style=\"padding: 88px 28px 96px; background: #10182B; color: #FFFFFF;\">\n    <div style=\"max-width: 900px; margin: 0 auto; display: flex; flex-direction: column; gap: 32px;\">\n      <div style=\"display: flex; flex-direction: column; gap: 12px; text-align: center; align-items: center;\">\n        <h2 style=\"font: 800 clamp(30px, 4.4vw, 42px)/1.1 'Archivo', sans-serif; letter-spacing: -0.02em; margin: 0;\">Book your detail<\u002Fh2>\n        <p style=\"font: 400 17px/1.6 'Work Sans'; color: #B6BDCA; margin: 0; max-width: 50ch;\">Pick a day, tell us where you park. We confirm by text within the hour.<\u002Fp>\n      <\u002Fdiv>\n\n      <div style=\"background: #FFFFFF; color: #10182B; border-radius: 22px; padding: 34px; display: flex; flex-direction: column; gap: 26px;\">\n        <div style=\"display: flex; flex-direction: column; gap: 12px;\">\n          <div style=\"font: 600 12px/1 'Work Sans'; letter-spacing: 0.18em; text-transform: uppercase; color: #8A93A6;\">1 · Pick a package<\u002Fdiv>\n          <div style=\"display: flex; flex-wrap: wrap; gap: 10px;\">\n            <sc-for list=\"{{ pkgOptions }}\" as=\"p\" hint-placeholder-count=\"3\">\n              <button type=\"button\" sc-camel-on-click=\"{{ p.select }}\" style=\"font: 600 15px/1 'Work Sans'; padding: 14px 20px; min-height: 44px; border-radius: 999px; cursor: pointer; border: 1.5px solid {{ p.border }}; background: {{ p.bg }}; color: {{ p.fg }};\">{{ p.label }}<\u002Fbutton>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"display: flex; flex-direction: column; gap: 12px;\">\n          <div style=\"font: 600 12px/1 'Work Sans'; letter-spacing: 0.18em; text-transform: uppercase; color: #8A93A6;\">2 · Choose a day<\u002Fdiv>\n          <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(92px, 1fr)); gap: 10px;\">\n            <sc-for list=\"{{ days }}\" as=\"d\" hint-placeholder-count=\"6\">\n              <button type=\"button\" sc-camel-on-click=\"{{ d.select }}\" style=\"display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 14px 8px; min-height: 44px; border-radius: 14px; cursor: pointer; border: 1.5px solid {{ d.border }}; background: {{ d.bg }}; color: {{ d.fg }};\">\n                <span style=\"font: 500 12px/1 'Work Sans'; opacity: 0.72;\">{{ d.dow }}<\u002Fspan>\n                <span style=\"font: 800 20px/1 'Archivo', sans-serif;\">{{ d.num }}<\u002Fspan>\n                <span style=\"font: 500 11px/1 'Work Sans'; color: {{ d.slotColor }};\">{{ d.slots }}<\u002Fspan>\n              <\u002Fbutton>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"display: flex; flex-direction: column; gap: 12px;\">\n          <div style=\"font: 600 12px/1 'Work Sans'; letter-spacing: 0.18em; text-transform: uppercase; color: #8A93A6;\">3 · Your details<\u002Fdiv>\n          <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px;\">\n            <input placeholder=\"Full name\" value=\"{{ fields.name }}\" sc-camel-on-change=\"{{ setName }}\" style=\"font: 400 16px/1 'Work Sans'; padding: 15px 16px; min-height: 48px; border-radius: 12px; border: 1.5px solid #D9DDE5; background: #FFFFFF; color: #10182B; width: 100%; box-sizing: border-box;\" style-focus=\"outline: none; border-color: #1E6FB8;\">\n            <input placeholder=\"Mobile number\" value=\"{{ fields.phone }}\" sc-camel-on-change=\"{{ setPhone }}\" style=\"font: 400 16px/1 'Work Sans'; padding: 15px 16px; min-height: 48px; border-radius: 12px; border: 1.5px solid #D9DDE5; background: #FFFFFF; color: #10182B; width: 100%; box-sizing: border-box;\" style-focus=\"outline: none; border-color: #1E6FB8;\">\n            <input placeholder=\"Address where the car is parked\" value=\"{{ fields.address }}\" sc-camel-on-change=\"{{ setAddress }}\" style=\"font: 400 16px/1 'Work Sans'; padding: 15px 16px; min-height: 48px; border-radius: 12px; border: 1.5px solid #D9DDE5; background: #FFFFFF; color: #10182B; width: 100%; box-sizing: border-box;\" style-focus=\"outline: none; border-color: #1E6FB8;\">\n            <input placeholder=\"Car — year, make, model\" value=\"{{ fields.car }}\" sc-camel-on-change=\"{{ setCar }}\" style=\"font: 400 16px/1 'Work Sans'; padding: 15px 16px; min-height: 48px; border-radius: 12px; border: 1.5px solid #D9DDE5; background: #FFFFFF; color: #10182B; width: 100%; box-sizing: border-box;\" style-focus=\"outline: none; border-color: #1E6FB8;\">\n          <\u002Fdiv>\n          <label style=\"display: flex; align-items: center; gap: 10px; font: 400 15px/1.4 'Work Sans'; color: {{ petLabelColor }}; cursor: {{ petCursor }}; padding: 6px 0;\">\n            <input type=\"checkbox\" checked=\"{{ petHair }}\" disabled=\"{{ petDisabled }}\" sc-camel-on-change=\"{{ togglePet }}\" style=\"width: 20px; height: 20px; accent-color: #1E6FB8; cursor: {{ petCursor }};\">\n            Add pet hair removal (+$45) — Full Reset only\n          <\u002Flabel>\n        <\u002Fdiv>\n\n        <div style=\"height: 1px; background: #E4E7EC;\"><\u002Fdiv>\n\n        <div style=\"display: flex; flex-wrap: wrap; gap: 18px; align-items: center; justify-content: space-between;\">\n          <div style=\"display: flex; flex-direction: column; gap: 3px;\">\n            <div style=\"font: 400 14px/1.3 'Work Sans'; color: #5A6377;\">{{ summaryLine }}<\u002Fdiv>\n            <div style=\"font: 900 32px/1 'Archivo', sans-serif; letter-spacing: -0.02em;\">{{ total }}<\u002Fdiv>\n          <\u002Fdiv>\n          <button type=\"button\" sc-camel-on-click=\"{{ onSubmit }}\" disabled=\"{{ submitBusy }}\" style=\"font: 700 16px/1 'Work Sans'; background: #FFC531; color: #10182B; border: none; padding: 18px 34px; min-height: 48px; border-radius: 999px; cursor: pointer;\" style-hover=\"background: #FFD866;\">{{ submitLabel }}<\u002Fbutton>\n        <\u002Fdiv>\n\n        <sc-for list=\"{{ statusLines }}\" as=\"s\" hint-placeholder-count=\"0\">\n          <div style=\"font: 500 14.5px/1.5 'Work Sans'; color: {{ s.color }}; background: {{ s.tint }}; border-left: 3px solid {{ s.color }}; padding: 13px 16px; border-radius: 0 10px 10px 0;\">{{ s.text }}<\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <footer style=\"background: #0A101C; color: #8A93A6; padding: 44px 28px; display: flex; flex-wrap: wrap; gap: 20px; align-items: center; justify-content: space-between;\">\n    <div style=\"display: flex; align-items: center; gap: 12px;\">\n      <svg sc-camel-view-box=\"0 0 120 120\" style=\"width: 30px; height: 30px;\" role=\"img\" aria-label=\"Bright Wheels\">\n        <circle cx=\"60\" cy=\"60\" r=\"44\" fill=\"none\" stroke=\"#FFC531\" stroke-width=\"9\"><\u002Fcircle>\n        <g stroke=\"#FFC531\" stroke-width=\"9\" stroke-linecap=\"round\">\n          <line x1=\"60\" y1=\"26\" x2=\"60\" y2=\"94\"><\u002Fline>\n          <line x1=\"30\" y1=\"43\" x2=\"90\" y2=\"77\"><\u002Fline>\n          <line x1=\"30\" y1=\"77\" x2=\"90\" y2=\"43\"><\u002Fline>\n        <\u002Fg>\n        <circle cx=\"60\" cy=\"60\" r=\"13\" fill=\"#FFC531\"><\u002Fcircle>\n      <\u002Fsvg>\n      <div style=\"font: 600 14px/1.4 'Work Sans'; color: #D6DAE2;\">Bright Wheels Detailing · Los Angeles &amp; the Bay Area<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"font: 400 14px/1.4 'Work Sans';\">Mon–Sat, 8am–6pm · @brightwheelsdetailing<\u002Fdiv>\n  <\u002Ffooter>\n<\u002Fdiv>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:1280,&quot;height&quot;:900}}\">\n/* ───────────────────────────────────────────────────────────────────────────\n   Bright Wheels Detailing — booking logic.\n\n   You should not need to edit this block. All the settings you actually\n   change live in window.BW_CONFIG, near the very top of index.html.\n   ─────────────────────────────────────────────────────────────────────────── */\n\nconst CFG = (typeof window !== \"undefined\" && window.BW_CONFIG) || {};\nconst SHEET_ENDPOINT = (CFG.endpoint || \"\").trim();\nconst CONTACT_PHONE  = (CFG.phone || \"\").trim();\nconst LEAD_DAYS      = CFG.leadDays == null ? 1 : CFG.leadDays;\nconst CAPACITY       = CFG.dailyCapacity || 3;\nconst CLOSED_DAYS    = CFG.closedDays || [0];   // 0 = Sunday\n\nconst DOW   = [\"SUN\", \"MON\", \"TUE\", \"WED\", \"THU\", \"FRI\", \"SAT\"];\nconst MONTH = [\"Jan\", \"Feb\", \"Mar\", \"Apr\", \"May\", \"Jun\",\n               \"Jul\", \"Aug\", \"Sep\", \"Oct\", \"Nov\", \"Dec\"];\n\n/* The next six open days, starting LEAD_DAYS from today. Rolls forward on\n   its own, so the calendar is never stale — nothing here is hardcoded. */\nfunction openDays(count) {\n  const out = [];\n  const d = new Date();\n  d.setHours(0, 0, 0, 0);\n  d.setDate(d.getDate() + LEAD_DAYS);\n  while (out.length < count) {\n    if (CLOSED_DAYS.indexOf(d.getDay()) === -1) out.push(new Date(d));\n    d.setDate(d.getDate() + 1);\n  }\n  return out;\n}\n\nfunction isoDate(d) {\n  return d.getFullYear() + \"-\" +\n    String(d.getMonth() + 1).padStart(2, \"0\") + \"-\" +\n    String(d.getDate()).padStart(2, \"0\");\n}\n\nfunction digitsOnly(s) { return (s || \"\").replace(/\\D/g, \"\"); }\n\nfunction makeRequestId() {\n  return \"bw-\" + Date.now().toString(36) + \"-\" +\n    Math.random().toString(36).slice(2, 8);\n}\n\nclass Component extends DCLogic {\n  state = {\n    pkg: 1,\n    dayIso: \"\",\n    petHair: false,\n    name: \"\", phone: \"\", address: \"\", car: \"\",\n    status: \"idle\",     // idle | sending | sent | error\n    message: \"\",\n    booked: null,       // { \"2026-09-22\": 2 } once availability loads\n    requestId: \"\"\n  };\n\n  /* Ask the Apps Script how many slots are already taken, so a full day\n     shows as full. If this fails we fail OPEN — better to take the booking\n     and sort it out by text than to turn a customer away over a fetch. */\n  componentDidMount() {\n    if (!SHEET_ENDPOINT) {\n      console.warn(\n        \"[Bright Wheels] window.BW_CONFIG.endpoint is empty — bookings are \" +\n        \"NOT being saved. See Part 2 of SETUP.md.\"\n      );\n      return;\n    }\n    fetch(SHEET_ENDPOINT + \"?availability=1\")\n      .then(function (r) { return r.json(); })\n      .then((d) => {\n        if (d && d.counts) this.setState({ booked: d.counts });\n      })\n      .catch(function () { /* fail open */ });\n  }\n\n  missingFields() {\n    const gaps = [];\n    if (this.state.name.trim().length < 2) gaps.push(\"your name\");\n    if (digitsOnly(this.state.phone).length < 10) gaps.push(\"a mobile number\");\n    if (this.state.address.trim().length < 5) gaps.push(\"the address where the car is parked\");\n    return gaps;\n  }\n\n  submit(payload) {\n    fetch(SHEET_ENDPOINT, {\n      method: \"POST\",\n      headers: { \"Content-Type\": \"text/plain;charset=utf-8\" },\n      body: JSON.stringify(payload)\n    })\n      .then(function (r) { return r.json(); })\n      .then((d) => {\n        if (!d || !d.ok) throw new Error((d && d.error) || \"rejected\");\n        this.setState({\n          status: \"sent\",\n          requestId: \"\",\n          message: \"Got it. We'll text \" + this.state.phone.trim() +\n                   \" within the hour to confirm.\"\n        });\n      })\n      .catch(() => {\n        /* The row may well have landed anyway — the request id means a retry\n           can't double-book, so it is safe to invite one. */\n        this.setState({\n          status: \"error\",\n          message: CONTACT_PHONE\n            ? \"That didn't go through. Try once more, or text us at \" +\n              CONTACT_PHONE + \" and we'll lock it in.\"\n            : \"That didn't go through — please try once more.\"\n        });\n      });\n  }\n\n  renderVals() {\n    const tierData = [\n      { name: \"Wheel Refresh\", price: \"$69\", dur: \"/ 60 min\", tag: \"Our specialty\", items: [\"All four wheels, faces and barrels\", \"Iron & brake-dust decontamination\", \"Tires scrubbed and dressed\", \"Wheel wells cleaned out\", \"Lug nuts and valve stems\"] },\n      { name: \"Wheels + Wash\", price: \"$139\", dur: \"/ 2 hrs\", tag: \"Most booked\", items: [\"Everything in Wheel Refresh\", \"Rinseless full exterior wash\", \"Bug & tar removal\", \"Spray wax sealant\", \"Glass in and out\", \"Door jambs wiped\"] },\n      { name: \"Full Reset\", price: \"$219\", dur: \"/ 3–4 hrs\", tag: \"Best value\", items: [\"Everything in Wheels + Wash\", \"Interior vacuum & deep clean\", \"Seats, mats and carpets shampooed\", \"Dash, vents and console detailed\", \"Leather cleaned + conditioned\"] }\n    ];\n\n    const tiers = tierData.map((t, i) => {\n      const hot = i === 1;\n      return Object.assign({}, t, {\n        bg: hot ? \"#10182B\" : \"#FFFFFF\",\n        fg: hot ? \"#FFFFFF\" : \"#10182B\",\n        border: hot ? \"#10182B\" : \"#E4E7EC\",\n        rule: hot ? \"rgba(255,255,255,0.16)\" : \"#E4E7EC\",\n        dot: hot ? \"#FFC531\" : \"#1E6FB8\",\n        tagBg: hot ? \"#FFC531\" : \"#EEF3F9\",\n        tagFg: hot ? \"#10182B\" : \"#1E6FB8\",\n        btnBg: hot ? \"#FFC531\" : \"#10182B\",\n        btnFg: hot ? \"#10182B\" : \"#FFFFFF\"\n      });\n    });\n\n    const prices = [69, 139, 219];\n    const names  = [\"Wheel Refresh\", \"Wheels + Wash\", \"Full Reset\"];\n\n    const pkgOptions = names.map((label, i) => {\n      const on = this.state.pkg === i;\n      return {\n        label: label + \" · $\" + prices[i],\n        select: () => this.setState({ pkg: i, status: \"idle\", message: \"\" }),\n        bg: on ? \"#10182B\" : \"#FFFFFF\",\n        fg: on ? \"#FFFFFF\" : \"#10182B\",\n        border: on ? \"#10182B\" : \"#D9DDE5\"\n      };\n    });\n\n    /* ── The calendar strip ───────────────────────────────────────────── */\n    const dates = openDays(6);\n    const booked = this.state.booked;\n\n    const dayInfo = dates.map((d) => {\n      const iso  = isoDate(d);\n      const used = booked ? (booked[iso] || 0) : 0;\n      const left = CAPACITY - used;\n      return {\n        iso: iso,\n        date: d,\n        full: booked ? left <= 0 : false,\n        slots: !booked ? \"Open\"\n             : left <= 0 ? \"Full\"\n             : left === 1 ? \"1 slot\"\n             : left + \" slots\"\n      };\n    });\n\n    /* Default to the first open day, and move off a day that filled up. */\n    let selected = this.state.dayIso;\n    const stillOpen = dayInfo.some((d) => d.iso === selected && !d.full);\n    if (!stillOpen) {\n      const firstOpen = dayInfo.find((d) => !d.full);\n      selected = firstOpen ? firstOpen.iso : \"\";\n    }\n\n    const days = dayInfo.map((d) => {\n      const on = d.iso === selected && !d.full;\n      return {\n        dow: DOW[d.date.getDay()],\n        num: String(d.date.getDate()),\n        slots: d.slots,\n        select: () => {\n          if (!d.full) this.setState({ dayIso: d.iso, status: \"idle\", message: \"\" });\n        },\n        bg:     d.full ? \"#F2F3F5\" : on ? \"#1E6FB8\" : \"#FFFFFF\",\n        fg:     d.full ? \"#A9AFBB\" : on ? \"#FFFFFF\" : \"#10182B\",\n        border: d.full ? \"#E4E7EC\" : on ? \"#1E6FB8\" : \"#D9DDE5\",\n        slotColor: d.full ? \"#A9AFBB\" : on ? \"rgba(255,255,255,0.85)\" : \"#1E7A45\"\n      };\n    });\n\n    const chosen = dayInfo.find((d) => d.iso === selected) || dayInfo[0];\n    const chosenLabel = chosen\n      ? DOW[chosen.date.getDay()].charAt(0) + DOW[chosen.date.getDay()].slice(1).toLowerCase() +\n        \" \" + chosen.date.getDate() + \" \" + MONTH[chosen.date.getMonth()]\n      : \"no day selected\";\n\n    const petAllowed = this.state.pkg === 2;\n    const petOn  = petAllowed && this.state.petHair;\n    const amount = prices[this.state.pkg] + (petOn ? 45 : 0);\n\n    const busy = this.state.status === \"sending\";\n\n    return {\n      heroStats: [\n        { v: \"60min\", l: \"All four wheels, done right\" },\n        { v: \"$69\", l: \"Starting price, flat\" },\n        { v: \"0\", l: \"Hoses needed — we work rinseless\" }\n      ],\n      founders: [\n        { initials: \"TK\", first: \"Tilek\", last: \"Karaev\" },\n        { initials: \"RI\", first: \"Ramazan\", last: \"Iusupov\" }\n      ],\n      ticker: [\"Wheel & rim specialists\", \"Rinseless — no hose needed\", \"Same-day quotes\", \"Cash, card, Zelle, Venmo\"],\n      services: [\n        { n: \"01\", title: \"Wheel & rim deep clean\", body: \"Faces, barrels, spokes and lug nuts. pH-neutral iron remover pulls out the baked-in brake dust a car wash never touches.\", time: \"60 min\" },\n        { n: \"02\", title: \"Tires & wheel wells\", body: \"Sidewalls scrubbed back to black, wells degreased, then a satin dressing that doesn't sling onto your paint.\", time: \"+20 min\" },\n        { n: \"03\", title: \"Rinseless exterior wash\", body: \"A full exterior wash using two gallons and a stack of plush towels. No hose, no runoff, safe for apartment garages.\", time: \"60 – 90 min\" },\n        { n: \"04\", title: \"Interior deep clean\", body: \"Vacuum, shampoo, vents and seams. Pet hair pulled out with rubber blades — golden retriever tested.\", time: \"90 min – 2 hrs\" }\n      ],\n      steps: [\n        { k: \"STEP 1\", title: \"Book online\", body: \"Pick your package and a day. Takes about a minute — no account, no deposit.\" },\n        { k: \"STEP 2\", title: \"We pull up\", body: \"Two of us and a Camry full of gear. Because we work rinseless, a parking spot is all we need — no hose, no outlet, no mess.\" },\n        { k: \"STEP 3\", title: \"Walk out to clean wheels\", body: \"We text you when it's done and walk you around it. Pay on the spot, however you like.\" }\n      ],\n      tiers,\n      pkgOptions,\n      days,\n      petHair: petOn,\n      petAllowed: petAllowed,\n      petDisabled: !petAllowed,\n      petLabelColor: petAllowed ? \"#5A6377\" : \"#A9AFBB\",\n      petCursor: petAllowed ? \"pointer\" : \"not-allowed\",\n      togglePet: () => {\n        if (petAllowed) this.setState((s) => ({ petHair: !s.petHair, status: \"idle\", message: \"\" }));\n      },\n      summaryLine: names[this.state.pkg] + \" · \" + chosenLabel + (petOn ? \" · + pet hair\" : \"\"),\n      total: \"$\" + amount,\n      fields: {\n        name: this.state.name, phone: this.state.phone,\n        address: this.state.address, car: this.state.car\n      },\n      setName:    (e) => this.setState({ name: e.target.value, status: \"idle\", message: \"\" }),\n      setPhone:   (e) => this.setState({ phone: e.target.value, status: \"idle\", message: \"\" }),\n      setAddress: (e) => this.setState({ address: e.target.value, status: \"idle\", message: \"\" }),\n      setCar:     (e) => this.setState({ car: e.target.value, status: \"idle\", message: \"\" }),\n\n      submitBusy: busy,\n      submitLabel: busy ? \"Sending…\"\n                 : this.state.status === \"sent\" ? \"Request sent ✓\"\n                 : \"Request this slot\",\n      /* One-item list when there's something to say, empty otherwise — the\n         template has sc-for but no sc-if, and an empty div would leave a\n         26px hole in the card. */\n      statusLines: this.state.message\n        ? [{\n            text: this.state.message,\n            color: this.state.status === \"sent\" ? \"#1E7A45\"\n                 : this.state.status === \"error\" ? \"#B3261E\"\n                 : \"#8A6D00\",\n            tint: this.state.status === \"sent\" ? \"#EAF7F0\"\n                 : this.state.status === \"error\" ? \"#FDECEA\"\n                 : \"#FFF6E0\"\n          }]\n        : [],\n\n      onSubmit: () => {\n        if (busy) return;                       // no double-submit\n\n        const gaps = this.missingFields();\n        if (gaps.length) {\n          const list = gaps.length === 1 ? gaps[0]\n            : gaps.slice(0, -1).join(\", \") + \" and \" + gaps[gaps.length - 1];\n          this.setState({ status: \"error\", message: \"We still need \" + list + \".\" });\n          return;\n        }\n        if (!chosen || chosen.full) {\n          this.setState({ status: \"error\", message: \"Pick a day that still has a slot open.\" });\n          return;\n        }\n        if (!SHEET_ENDPOINT) {\n          this.setState({\n            status: \"error\",\n            message: CONTACT_PHONE\n              ? \"Online booking isn't switched on yet — text us at \" + CONTACT_PHONE + \".\"\n              : \"Online booking isn't switched on yet.\"\n          });\n          return;\n        }\n\n        /* Keep the same id across retries so a resend can't double-book. */\n        const requestId = this.state.requestId || makeRequestId();\n        this.setState({ status: \"sending\", message: \"\", requestId: requestId });\n\n        this.submit({\n          requestId: requestId,\n          submittedAt: new Date().toISOString(),\n          date: chosen.iso,\n          dayLabel: chosenLabel,\n          package: names[this.state.pkg],\n          petHair: petOn ? \"yes\" : \"no\",\n          total: amount,\n          name: this.state.name.trim(),\n          phone: this.state.phone.trim(),\n          address: this.state.address.trim(),\n          car: this.state.car.trim()\n        });\n      }\n    };\n  }\n}\n\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
