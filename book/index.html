<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Book — Bright Wheels Detailing</title>

  <!-- Instagram (and a few other apps) percent-encode the "#" in a bio link,
       turning /#book into /%23book, which is a path and not a fragment. This
       page exists so the link can be shared without a hash at all. -->
  <meta name="robots" content="noindex">
  <link rel="canonical" href="https://bright-wheels.net/">
  <meta http-equiv="refresh" content="0; url=/#book">
  <script>location.replace('/#book');</script>

  <style>
    body {
      margin: 0; min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
      background: #10182B; color: #FFFFFF;
      font: 500 16px/1.5 system-ui, -apple-system, sans-serif;
      text-align: center; padding: 24px;
    }
    a { color: #FFC531; }
  </style>
</head>
<body>
  <div>
    <svg viewBox="0 0 120 120" width="56" height="56" role="img" aria-label="Bright Wheels">
      <circle cx="60" cy="60" r="44" fill="none" stroke="#FFC531" stroke-width="9"></circle>
      <g stroke="#FFC531" stroke-width="9" stroke-linecap="round">
        <line x1="60" y1="26" x2="60" y2="94"></line>
        <line x1="30" y1="43" x2="90" y2="77"></line>
        <line x1="30" y1="77" x2="90" y2="43"></line>
      </g>
      <circle cx="60" cy="60" r="13" fill="#FFC531"></circle>
      <circle cx="60" cy="60" r="5" fill="#10182B"></circle>
    </svg>
    <p>Taking you to the booking form…</p>
    <p><a href="/#book">Tap here if nothing happens</a></p>
  </div>
</body>
</html>
